[project]
name = "inferx"
version = "0.1.0"
description = "LLM inference gateway with cost-aware routing, fault tolerance, and reproducible benchmarks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
inferx = "inferx:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
