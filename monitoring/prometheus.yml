# Prometheus configuration for the local Docker Compose setup.

global:
  # How often to collect metrics. 5 seconds makes the demo feel live;
  # 15 to 60 seconds is more common in production.
  scrape_interval: 5s

scrape_configs:
  - job_name: inferx
    static_configs:
      # "inferx" is the service name in compose.yaml. Compose's network
      # resolves it to the InferX container's address.
      - targets: ["inferx:8000"]